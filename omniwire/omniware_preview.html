:root {
  --ow-bg: #f8f6f1;
  --ow-paper: #ffffff;
  --ow-border: #4a4a4a;
  --ow-border-light: #b0b0b0;
  --ow-text: #333333;
  --ow-text-light: #777777;
  --ow-green: #5a9e6f;
  --ow-green-lt: #d4edda;
  --ow-red: #c0504d;
  --ow-red-lt: #f8d7da;
  --ow-yellow: #c09850;
  --ow-yellow-lt: #fff3cd;
  --ow-blue: #4a7fb5;
  --ow-blue-lt: #d6e4f0;
  --ow-purple: #6b5b95;
  --ow-purple-lt: #f0ecff;
  --ow-gray: #999999;
  --ow-gray-lt: #eeeeee;
  --ow-grid: #e8e4dd;
  --ow-font-hand: 'Architects Daughter', 'Patrick Hand', cursive;
  --ow-font-body: 'Patrick Hand', cursive;
  --ow-font-mono: 'Courier New', monospace;
}

.ow-page {
  font-family: var(--ow-font-body);
  font-size: 14px;
  color: var(--ow-text);
  background: var(--ow-bg);
  background-image:
    linear-gradient(var(--ow-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--ow-grid) 1px, transparent 1px);
  background-size: 20px 20px;
  max-width: 1100px;
  margin: 0 auto;
  position: relative;
}

.ow-page-inner {
  background: var(--ow-paper);
  border: 2px solid var(--ow-border);
  border-radius: 3px;
  box-shadow: 4px 4px 0px rgba(0,0,0,0.12);
  overflow: hidden;
  position: relative;
}

.ow-ribbon {
  position: absolute;
  top: 14px;
  right: -38px;
  padding: 3px 48px;
  font-family: var(--ow-font-hand);
  font-size: 9px;
  letter-spacing: 1.5px;
  transform: rotate(45deg);
  z-index: 10;
  color: #fff;
  text-transform: uppercase;
}
.ow-ribbon-draft    { background: var(--ow-red); }
.ow-ribbon-review   { background: var(--ow-yellow); }
.ow-ribbon-approved { background: var(--ow-green); }

.ow-content { padding: 16px 20px; }

/* ── Nav ── */
.ow-nav {
  display: flex;
  background: var(--ow-border);
  padding: 0;
  flex-wrap: wrap;
}
.ow-nav-logo {
  padding: 9px 14px;
  color: #fff;
  font-family: var(--ow-font-hand);
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  border-right: 1px solid #555;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ow-nav-item {
  padding: 9px 16px;
  color: #ccc;
  font-family: var(--ow-font-hand);
  font-size: 13px;
  border-right: 1px solid #555;
}
.ow-nav-item-active {
  background: var(--ow-paper);
  color: var(--ow-text);
  font-weight: bold;
}

/* ── Breadcrumb ── */
.ow-breadcrumb {
  padding: 8px 20px;
  font-size: 12px;
  color: var(--ow-text-light);
  border-bottom: 1px solid var(--ow-grid);
}

/* ── Section ── */
.ow-section {
  margin-bottom: 16px;
  border: 1.5px solid var(--ow-border);
  border-radius: 2px;
  box-shadow: 2px 2px 0px rgba(0,0,0,0.08);
}
.ow-section-title {
  font-family: var(--ow-font-hand);
  font-size: 14px;
  font-weight: bold;
  padding: 7px 12px;
  background: #f0ede6;
  border-bottom: 1.5px solid var(--ow-border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ow-section-icon {
  width: 18px;
  height: 18px;
  background: var(--ow-border);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 10px;
  flex-shrink: 0;
}
.ow-section-body { padding: 12px; }

/* ── Grid ── */
.ow-grid { display: grid; gap: 6px 20px; }
.ow-grid-2 { grid-template-columns: 1fr 1fr; }
.ow-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.ow-grid-1 { grid-template-columns: 1fr; }
.ow-grid-row { display: flex; gap: 8px; align-items: baseline; }
.ow-grid-label {
  font-size: 12px;
  color: var(--ow-text-light);
  min-width: 100px;
  white-space: nowrap;
  flex-shrink: 0;
}
.ow-grid-value {
  font-family: var(--ow-font-hand);
  font-size: 14px;
}

/* ── Badges ── */
.ow-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.ow-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 2px;
  font-size: 12px;
  border: 1px solid;
}
.ow-badge::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.ow-badge-green  { background: var(--ow-green-lt); border-color: var(--ow-green); color: var(--ow-green); }
.ow-badge-red    { background: var(--ow-red-lt); border-color: var(--ow-red); color: var(--ow-red); }
.ow-badge-yellow { background: var(--ow-yellow-lt); border-color: var(--ow-yellow); color: var(--ow-yellow); }
.ow-badge-blue   { background: var(--ow-blue-lt); border-color: var(--ow-blue); color: var(--ow-blue); }
.ow-badge-gray   { background: var(--ow-gray-lt); border-color: var(--ow-gray); color: var(--ow-gray); }

/* ── Tabs ── */
.ow-tabs {
  display: flex;
  border-bottom: 2px solid var(--ow-border);
  flex-wrap: wrap;

  border: 1px solid var(--ow-border-light);

  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;

.ow-form-label {

  background: #faf8f3;

  font-size: 13px;
  background: #faf8f3;

  font-size: 13px;

  width: 14px;
  height: 14px;

}

/* ── Note ── */
.ow-note {
  padding: 6px 10px;

  font-size: 12px;
  font-family: var(--ow-font-hand);

.ow-note-error::before { content: '❌ '; }
.ow-note-success::before { content: '✅ '; }

/* ── Alert ── */
.ow-alert {
  padding: 8px 12px;
  border-radius: 2px;
  font-size: 13px;
  margin-bottom: 8px;
  border-left: 4px solid;
}
.ow-alert-info    { background: var(--ow-blue-lt); border-color: var(--ow-blue); }
.ow-alert-warning { background: var(--ow-yellow-lt); border-color: var(--ow-yellow); }
.ow-alert-error   { background: var(--ow-red-lt); border-color: var(--ow-red); }
.ow-alert-success { background: var(--ow-green-lt); border-color: var(--ow-green); }

/* ── Placeholder ── */
.ow-placeholder {
  background: repeating-linear-gradient(45deg, #f0ede6, #f0ede6 10px, #e8e4dd 10px, #e8e4dd 20px);
  border: 1.5px solid var(--ow-border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--ow-font-hand);
  font-size: 12px;
  color: var(--ow-text-light);
  min-height: 60px;
  border-radius: 2px;
  text-align: center;
  padding: 12px;
}

/* ── Formula ── */
.ow-formula {
  background: #f5f3ee;
  border: 1px dashed var(--ow-border-light);
  padding: 8px 14px;
  font-family: var(--ow-font-mono);
  font-size: 12px;
  color: var(--ow-purple);
  border-radius: 2px;
  margin: 8px 0;
}

/* ── Locked Overlay ── */
.ow-locked {
  position: relative;
  margin: 8px 0;
}

.ow-locked-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.7);
  border: 2px dashed var(--ow-red);
  border-radius: 2px;
  font-family: var(--ow-font-hand);
  color: var(--ow-red);
  font-size: 13px;

/* ── Radio standalone ── */

.ow-radio-group-label { font-size: 12px; color: var(--ow-text-light); margin-bottom: 6px; }
.ow-radio-options { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;

.ow-radio-circle {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--ow-border);
  border-radius: 50%;

  flex-shrink: 0;

  border-radius: 50%;

/* ── Textarea standalone ── */

.ow-textarea-label { font-size: 12px; color: var(--ow-text-light); margin-bottom: 4px; }

/* ── Divider ── */
.ow-divider {
  border: none;
  border-top: 1px dashed var(--ow-border-light);
  margin: 14px 0;
}

/* ── Footer ── */
.ow-footer {
  padding: 8px 20px;
  border-top: 1px solid var(--ow-grid);
  font-size: 11px;
  color: var(--ow-text-light);
  background: #faf8f3;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

/* ── Progress ── */
.ow-progress { display: flex; align-items: center; gap: 0; margin: 8px 0; flex-wrap: wrap; }
.ow-progress-step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-family: var(--ow-font-hand);
  padding: 5px 12px;
  border: 1px solid var(--ow-border-light);
  border-right: none;
  background: var(--ow-paper);
}

.ow-progress-step:last-child { border-right: 1px solid var(--ow-border-light); border-radius: 0 2px 2px 0; }
.ow-progress-done   { background: var(--ow-green-lt); border-color: var(--ow-green); color: var(--ow-green); }
.ow-progress-active  { background: var(--ow-blue-lt); border-color: var(--ow-blue); color: var(--ow-blue); font-weight: bold; }
.ow-progress-pending { color: var(--ow-gray); }
.ow-progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* ── Metrics ── */
.ow-metrics { display: flex; gap: 12px; flex-wrap: wrap; }
.ow-metric-card {
  flex: 1;
  min-width: 120px;
  padding: 12px;
  border: 1.5px solid var(--ow-border-light);
  border-radius: 2px;
  text-align: center;
  background: var(--ow-paper);
}
.ow-metric-value {
  font-family: var(--ow-font-hand);
  font-size: 22px;
  font-weight: bold;
}
.ow-metric-label {
  font-size: 11px;
  color: var(--ow-text-light);
  margin-top: 2px;
}

/* ── Columns ── */
.ow-columns { display: flex; gap: 16px; }
.ow-col { flex: 1; min-width: 0; }

/* ── Inline Styles ── */
.ow-ref {
  font-size: 10px;
  color: var(--ow-purple);
  font-family: var(--ow-font-mono);
  background: var(--ow-purple-lt);
  padding: 1px 5px;
  border-radius: 2px;
  margin-left: 3px;
}

.ow-color-blue   { color: var(--ow-blue); font-weight: bold; }

.ow-inline-btn {
  display: inline-block;

  font-family: var(--ow-font-hand);
  font-size: 11px;
  border: 1px solid var(--ow-border-light);
  border-radius: 2px;

}

.ow-tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: bold;
  font-family: var(--ow-font-hand);

}
.ow-tag-green  { background: var(--ow-green-lt); color: var(--ow-green); border-color: var(--ow-green); }
.ow-tag-red    { background: var(--ow-red-lt); color: var(--ow-red); border-color: var(--ow-red); }

/* ── Responsive ── */
@media (max-width: 700px) {
  .ow-grid-2, .ow-grid-3, .ow-form-2, .ow-form-3 { grid-template-columns: 1fr; }
  .ow-badges, .ow-metrics { flex-direction: column; }
  .ow-columns { flex-direction: column; }
  .ow-nav { flex-wrap: wrap; }
  .ow-table { font-size: 11px; }
}

  // ═══════════════════════════════════════════════════════════
  // 2. PARSER
  // ═══════════════════════════════════════════════════════════

  const ICON_MAP = {
    info: 'i', check: '✓', lock: '🔒', star: '★', currency: '₺',
    play: '▶', chart: '📊', user: '👤', settings: '⚙', doc: '📄',
    clock: '⏱', warning: '⚠'
  };

  /**
   * Parse inline markup:  **bold**, (REF), {color}text, [Button]
   */
  function parseInline(text) {
    if (!text) return '';
    let s = text;
    // Escape HTML
    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // **bold**
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    // (REF-CODE) — but not inside other constructs
    s = s.replace(/\(([A-Z][A-Z0-9\-_~,.§ ]+?)\)/g, '<span class="ow-ref">$1</span>');
    // {color}text until next space-group or end — for tags
    s = s.replace(/\{(green|red|yellow|blue|gray)\}(\S+(?:\s+\S+)*?)(?=\s{2,}|\||$)/g, (_, color, txt) => {
      // Check if it looks like a tag (single word or short phrase)
      if (txt.length < 30) {
        return `<span class="ow-tag ow-tag-${color}">${txt}</span>`;
      }
      return `<span class="ow-color-${color}">${txt}</span>`;
    });
    // [Button Text]
    s = s.replace(/\[([^\]]+)\]/g, '<span class="ow-inline-btn">$1</span>');
    return s;
  }

  /**
   * Tokenize input: split lines, compute indent, identify block types
   */
  function tokenize(input) {
    const lines = input.split('\n');
    const tokens = [];
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i];
      const trimmed = raw.replace(/\t/g, '  ');
      const stripped = trimmed.trimStart();
      if (!stripped || stripped.startsWith('//')) continue; // empty or comment
      const indent = (trimmed.length - stripped.length) / 2 | 0;
      let type = 'content';
      let value = stripped;
      if (stripped.startsWith('@')) {
        const m = stripped.match(/^@(\w+)\s*(.*)/);
        if (m) {
          type = m[1];
          value = m[2] || '';
        }
      }
      tokens.push({ line: i + 1, indent, type, value });
    }
    return tokens;
  }

  /**
   * Parse properties from value string:  "Title" icon:info ref:FR-001 cols:2
   */
  function parseProps(value) {
    const props = {};
    let rest = value;
    // Quoted title
    const titleMatch = rest.match(/^"([^"]+)"\s*/);
    if (titleMatch) {
      props.title = titleMatch[1];
      rest = rest.slice(titleMatch[0].length);
    }
    // key:value pairs
    const kvRegex = /(\w+):(?:"([^"]+)"|(\S+))/g;
    let m;
    while ((m = kvRegex.exec(rest)) !== null) {
      props[m[1]] = m[2] || m[3];
    }
    // If no title was found and there's remaining text before first key:
    if (!props.title) {
      const beforeKeys = rest.replace(/\w+:(?:"[^"]+"|[^\s]+)/g, '').trim();
      if (beforeKeys) props.title = beforeKeys;

  /**
   * Build AST tree from flat tokens using indent-based nesting
   */
  function buildTree(tokens) {
    const root = { type: 'root', props: {}, children: [], indent: -1 };
    const stack = [root];

    for (const token of tokens) {
      const node = {
        type: token.type,
        value: token.value,
        props: token.type !== 'content' ? parseProps(token.value) : {},
        children: [],
        indent: token.indent

      // Pop stack until we find a parent with indent < current
      while (stack.length > 1 && stack[stack.length - 1].indent >= token.indent) {
        stack.pop();
      }
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    }

    if (fn) return fn(node);

      const ribbonLabel = ribbonLabels[status] || ribbonLabels.draft;

      let inner = '';
      for (const child of node.children) {

          inner += renderNode(child);
        } else {

        }
      }

      // Separate structural vs content children
      let html = `<div class="ow-page"><div class="ow-page-inner">`;
      html += `<div class="ow-ribbon ow-ribbon-${status}">${ribbonLabel}</div>`;

      let inContent = false;
      for (const child of node.children) {
        if (['nav', 'breadcrumb', 'footer'].includes(child.type)) {
          if (inContent) { html += '</div>'; inContent = false; }
          html += renderNode(child);
        } else {
          if (!inContent) { html += '<div class="ow-content">'; inContent = true; }
          html += renderNode(child);
        }
      }
      if (inContent) html += '</div>';
      html += '</div></div>';
      return html;
    },

    nav(node) {
      const lines = getContentLines(node);
      if (lines.length === 0) return '';
      const items = lines[0].split('|').map(s => s.trim());
      let html = '<div class="ow-nav">';
      // First item is logo
      html += `<div class="ow-nav-logo">◈ ${items[0]}</div>`;
      for (let i = 1; i < items.length; i++) {
        const item = items[i];
        const active = item.startsWith('*') && item.endsWith('*');
        const label = active ? item.slice(1, -1) : item;
        html += `<div class="ow-nav-item${active ? ' ow-nav-item-active' : ''}">${label}</div>`;

      html += '</div>';
      return html;
    },

    breadcrumb(node) {
      const lines = getContentLines(node);
      if (lines.length === 0) return '';
      return `<div class="ow-breadcrumb">${parseInline(lines[0])}</div>`;
    },

    section(node) {
      const title = node.props.title || '';
      const icon = node.props.icon ? ICON_MAP[node.props.icon] || node.props.icon : '';
      const refs = node.props.ref ? node.props.ref.split(',').map(r =>

      let html = '<div class="ow-section">';
      html += '<div class="ow-section-title">';
      if (icon) html += `<span class="ow-section-icon">${icon}</span>`;

      html += `<div class="ow-section-body">${renderChildren(node)}</div>`;

    grid(node) {
      const cols = parseInt(node.props.cols) || 2;
      const lines = getContentLines(node);
      let html = `<div class="ow-grid ow-grid-${cols}">`;
      for (const line of lines) {

        html += '</tr>';
      }
      html += '</tbody></table></div>';
      // Render child blocks (like @buttons below a @table)
      html += getChildBlocks(node).map(renderNode).join('');
      return html;
    },

    buttons(node) {
      const lines = getContentLines(node);
      let html = '<div class="ow-buttons">';
      for (const line of lines) {
        const m = line.match(/^\[(\w+)\]\s*(.+)/);
        if (m) {
          const style = m[1]; // primary, success, danger, default
          const label = m[2];
          const cls = style !== 'default' ? ` ow-btn-${style}` : '';
          html += `<span class="ow-btn${cls}">${label}</span>`;
        } else {
          html += `<span class="ow-btn">${line}</span>`;
        }
      }
      html += '</div>';
      return html;
    },

    form(node) {
      const cols = parseInt(node.props.cols) || 1;
      const lines = getContentLines(node);
      let html = `<div class="ow-form ow-form-${cols}">`;
      for (const line of lines) {
        html += renderFormField(line);
      }
      html += '</div>';
      return html;
    },

    note(node) {
      const type = node.props.type || 'info';
      const lines = getContentLines(node);
      return `<div class="ow-note ow-note-${type}">${parseInline(lines.join(' '))}</div>`;
    },

    alert(node) {
      const type = node.props.type || 'info';
      const refs = node.props.ref ? ` <span class="ow-ref">${node.props.ref}</span>` : '';
      const lines = getContentLines(node);
      return `<div class="ow-alert ow-alert-${type}">${parseInline(lines.join(' '))}${refs}</div>`;
    },

    placeholder(node) {
      const h = parseInt(node.props.height) || 80;
      const lines = getContentLines(node);
      return `<div class="ow-placeholder" style="min-height:${h}px">[ ${lines.join(' ') || 'Placeholder'} ]</div>`;
    },

    formula(node) {
      const lines = getContentLines(node);
      return `<div class="ow-formula"><b>Formula:</b> ${parseInline(lines.join(' '))}</div>`;
    },

    locked(node) {
      const title = node.props.title || '🔒 Locked Area';
      const childBlocks = getChildBlocks(node);
      let innerHtml = childBlocks.map(renderNode).join('');
      if (!innerHtml) {
        const lines = getContentLines(node);
        innerHtml = lines.map(l => `<div>${parseInline(l)}</div>`).join('');
      }
      return `<div class="ow-locked"><div class="ow-locked-inner">${innerHtml}</div><div class="ow-locked-overlay">🔒 ${title}</div></div>`;
    },

    radio(node) {
      const title = node.props.title || '';
      const lines = getContentLines(node);
      if (lines.length === 0) return '';
      const items = lines[0].split('|').map(s => s.trim());
      let html = '<div class="ow-radio-group">';
      if (title) html += `<div class="ow-radio-group-label">${title}</div>`;
      html += '<div class="ow-radio-options">';
      for (const item of items) {
        const active = item.startsWith('*') && item.endsWith('*');
        const label = active ? item.slice(1, -1) : item;
        html += `<span class="ow-radio-opt"><span class="ow-radio-circle${active ? ' ow-radio-circle-selected' : ''}"></span>${label}</span>`;
      }
      html += '</div></div>';
      return html;
    },

    textarea(node) {
      const title = node.props.title || '';
      const rows = parseInt(node.props.rows) || 3;
      const lines = getContentLines(node);
      const value = lines.join('\n');
      let html = '<div class="ow-textarea-group">';
      if (title) html += `<div class="ow-textarea-label">${title}</div>`;
      html += `<textarea class="ow-form-textarea" rows="${rows}" readonly>${value}</textarea>`;
      html += '</div>';
      return html;
    },

    divider() {
      return '<hr class="ow-divider">';
    },

    footer(node) {
      const lines = getContentLines(node);
      let html = '<div class="ow-footer">';
      for (const line of lines) {
        html += `<div>${parseInline(line)}</div>`;
      }
      html += '</div>';
      return html;
    },

    progress(node) {
      const lines = getContentLines(node);
      if (lines.length === 0) return '';
      const items = lines[0].split('|').map(s => s.trim());
      let html = '<div class="ow-progress">';
      for (const item of items) {
        const m = item.match(/^\{(\w+)\}\s*(.+)/);
        const status = m ? m[1] : 'pending';
        const label = m ? m[2] : item;
        html += `<div class="ow-progress-step ow-progress-${status}"><span class="ow-progress-dot"></span>${label}</div>`;
      }
      html += '</div>';
      return html;
    },

    metric(node) {
      const lines = getContentLines(node);
      let html = '<div class="ow-metrics">';
      for (const line of lines) {
        const sepIdx = line.indexOf(':');
        if (sepIdx === -1) continue;
        const label = line.slice(0, sepIdx).trim().replace(/"/g, '');
        const rest = line.slice(sepIdx + 1).trim();
        // Extract **value**, optional {color}
        const valMatch = rest.match(/\*\*(.+?)\*\*/);
        const colorMatch = rest.match(/\{(\w+)\}/);
        const value = valMatch ? valMatch[1] : rest;
        const color = colorMatch ? colorMatch[1] : 'blue';
        html += `<div class="ow-metric-card"><div class="ow-metric-value ow-color-${color}">${value}</div><div class="ow-metric-label">${label}</div></div>`;
      }
      html += '</div>';
      return html;
    },

    columns(node) {
      let html = '<div class="ow-columns">';
      const cols = node.children.filter(c => c.type === 'col');
      for (const col of cols) {
        html += `<div class="ow-col">${renderChildren(col)}</div>`;
      }
      html += '</div>';
      return html;
    },

    col(node) {
      return renderChildren(node);
    }
  };

  /**
   * Render a single form field line
   */
  function renderFormField(line) {
    const parts = line.trim().split(/\s{2,}/);
    if (parts.length < 2) return '';

    const fieldType = parts[0]; // text, select, date, number, textarea, file, checkbox, radio
    const label = (parts[1] || '').replace(/"/g, '');
    const rest = parts.slice(2).join(' ');

    const required = rest.includes('required');
    const readonly = rest.includes('readonly');

    const valueMatch = rest.match(/value:"([^"]+)"/);
    const value = valueMatch ? valueMatch[1] : '';

    const optionsMatch = rest.match(/options:"([^"]+)"/);
    const options = optionsMatch ? optionsMatch[1].split(',').map(s => s.trim()) : [];

    const rowsMatch = rest.match(/rows:(\d+)/);
    const rows = rowsMatch ? parseInt(rowsMatch[1]) : 3;

    let html = '<div class="ow-form-field">';

    switch (fieldType) {
      case 'text':
      case 'date':
      case 'number':
        html += `<label class="ow-form-label">${label}${required ? ' <span class="ow-required">*</span>' : ''}</label>`;
        html += `<div class="ow-form-input${readonly ? ' ow-form-input-readonly' : ''}">${value || (fieldType === 'date' ? 'dd/mm/yyyy' : '')}</div>`;
        break;
      case 'select':
        html += `<label class="ow-form-label">${label}${required ? ' <span class="ow-required">*</span>' : ''}</label>`;
        html += `<div class="ow-form-input ow-form-select">${options[0] || 'Select...'} ▾</div>`;
        break;
      case 'textarea':
        html += `<label class="ow-form-label">${label}</label>`;
        html += `<div class="ow-form-textarea" style="min-height:${rows * 18}px">${value}</div>`;
        break;
      case 'file':
        html += `<label class="ow-form-label">${label}</label>`;
        html += `<div class="ow-form-file">📎 Drag & drop or click</div>`;
        break;
      case 'checkbox':
        html += `<div class="ow-form-check-row"><span class="ow-form-check-box">✓</span>${label}</div>`;
        break;
      case 'radio':
        html += `<label class="ow-form-label">${label}</label>`;
        html += '<div class="ow-form-radio-options">';
        for (let i = 0; i < options.length; i++) {
          const sel = i === 0 ? ' ow-radio-circle-selected' : '';
          html += `<span class="ow-radio-opt"><span class="ow-radio-circle${sel}"></span>${options[i]}</span>`;
        }
        html += '</div>';
        break;
      default:
        html += `<label class="ow-form-label">${label}</label>`;
        html += `<div class="ow-form-input">${value}</div>`;
    }

    html += '</div>';
    return html;
  }

  // ═══════════════════════════════════════════════════════════
  // 4. PUBLIC API
  // ═══════════════════════════════════════════════════════════

  let stylesInjected = false;

  function injectStyles(doc) {
    if (stylesInjected) return;
    const style = doc.createElement('style');
    style.textContent = STYLES;
    style.id = 'omniware-styles';
    doc.head.appendChild(style);
    stylesInjected = true;
  }

  /**
   * Parse DSL string → HTML string
   */
  function toHTML(dsl) {
    const tokens = tokenize(dsl);
    const ast = buildTree(tokens);
    return renderNode(ast);
  }

  /**
   * Render DSL string into a target DOM element
   */
  function render(dsl, targetElement) {
    injectStyles(document);
    targetElement.innerHTML = toHTML(dsl);
  }

  /**
   * Get a complete standalone HTML document (for iframe embedding)
   */
  function toStandalone(dsl) {
    const body = toHTML(dsl);
    return `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>*{box-sizing:border-box;margin:0;padding:0}body{padding:0;min-height:100vh}${STYLES}</style>
</head><body>${body}</body></html>`;
  }

  /**
   * Auto-detect and render all ```wireframe code blocks in document
   */
  function init(selector) {
    injectStyles(document);
    const blocks = document.querySelectorAll(selector || 'code.language-wireframe, pre > code.wireframe');
    blocks.forEach(block => {
      const dsl = block.textContent;
      const container = document.createElement('div');
      container.className = 'omniware-container';
      container.innerHTML = toHTML(dsl);
      const pre = block.closest('pre') || block.parentElement;
      pre.replaceWith(container);
    });
  }

  // Public API
  return { render, toHTML, toStandalone, init, version: '1.0.0' };

})();

// Support CommonJS / ES Module / UMD
if (typeof module !== 'undefined' && module.exports) {
  module.exports = OmniWare;
}
